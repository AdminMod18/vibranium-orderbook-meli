<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1900 800" width="1900" height="800" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif">
<defs><marker id="a-2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="a-059669" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="a-d97706" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="a-64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker><marker id="a-dc2626" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs>
<rect x="0" y="0" width="1900" height="800" rx="0" fill="#ffffff" stroke="none" stroke-width="1.5" />
<text x="40" y="54" font-size="30" font-weight="800" fill="#0f172a" text-anchor="start">Vibranium Order Book · Camino de una orden</text>
<text x="40" y="84" font-size="15.5" font-weight="400" fill="#475569" text-anchor="start">Dentro del proceso: un solo escritor ordena todo, y solo confirma lo que ya está en disco. Es lo que corre en el pod orderbook-0 (o en docker compose).</text>
<rect x="40" y="290" width="220" height="130" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2" />
<text x="54" y="316" font-size="16" font-weight="700" fill="#2563eb" text-anchor="start">Clientes</text>
<text x="54" y="340" font-size="14" font-weight="400" fill="#334155" text-anchor="start">JMeter · robots · curl</text>
<text x="54" y="361" font-size="14" font-weight="400" fill="#334155" text-anchor="start">miles de órdenes a la vez</text>
<rect x="290" y="120" width="1330" height="640" rx="18" fill="#f8fafc" stroke="#94a3b8" stroke-width="2.5" />
<text x="312" y="152" font-size="17" font-weight="700" fill="#334155" text-anchor="start">Proceso orderbook · un solo binario Go · 1 réplica (un solo escritor por diseño)</text>
<rect x="320" y="220" width="230" height="230" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2" />
<text x="334" y="246" font-size="16" font-weight="700" fill="#2563eb" text-anchor="start">API HTTP :8080</text>
<text x="334" y="270" font-size="14" font-weight="400" fill="#334155" text-anchor="start">valida JSON y ids</text>
<text x="334" y="291" font-size="14" font-weight="400" fill="#334155" text-anchor="start">ventana de idempotencia</text>
<text x="334" y="312" font-size="14" font-weight="400" fill="#334155" text-anchor="start">(5 M ids; repetido → 409)</text>
<text x="334" y="333" font-size="14" font-weight="400" fill="#334155" text-anchor="start">sin saldo → 422</text>
<text x="334" y="354" font-size="14" font-weight="400" fill="#334155" text-anchor="start">cancelar · consultar libro</text>
<rect x="600" y="255" width="170" height="160" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2" />
<text x="614" y="281" font-size="16" font-weight="700" fill="#2563eb" text-anchor="start">Cola acotada</text>
<text x="614" y="305" font-size="14" font-weight="400" fill="#334155" text-anchor="start">10 000 comandos</text>
<text x="614" y="326" font-size="14" font-weight="400" fill="#334155" text-anchor="start"></text>
<text x="614" y="347" font-size="14" font-weight="400" fill="#334155" text-anchor="start">si se llena:</text>
<text x="614" y="368" font-size="14" font-weight="400" fill="#334155" text-anchor="start">503 (backpressure)</text>
<rect x="830" y="200" width="470" height="270" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2" />
<text x="846" y="228" font-size="17" font-weight="700" fill="#2563eb" text-anchor="start">Secuenciador · UN solo escritor</text>
<text x="846" y="252" font-size="13" font-weight="400" fill="#1d4ed8" text-anchor="start">toma de a un comando: orden total, sin concurrencia</text>
<rect x="848" y="268" width="205" height="140" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2" />
<text x="862" y="294" font-size="15" font-weight="700" fill="#2563eb" text-anchor="start">Libro de ofertas</text>
<text x="862" y="318" font-size="14" font-weight="400" fill="#334155" text-anchor="start">heap de precios + FIFO</text>
<text x="862" y="339" font-size="14" font-weight="400" fill="#334155" text-anchor="start">ejecuta al precio del</text>
<text x="862" y="360" font-size="14" font-weight="400" fill="#334155" text-anchor="start">maker (el que esperaba)</text>
<text x="862" y="381" font-size="14" font-weight="400" fill="#334155" text-anchor="start">máx. 10 000 trades/orden</text>
<rect x="1073" y="268" width="205" height="140" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2" />
<text x="1087" y="294" font-size="15" font-weight="700" fill="#2563eb" text-anchor="start">Billeteras</text>
<text x="1087" y="318" font-size="14" font-weight="400" fill="#334155" text-anchor="start">reserva al ingresar:</text>
<text x="1087" y="339" font-size="14" font-weight="400" fill="#334155" text-anchor="start">saldo libre vs reservado</text>
<text x="1087" y="360" font-size="14" font-weight="400" fill="#334155" text-anchor="start">conservación verificable</text>
<text x="1087" y="381" font-size="14" font-weight="400" fill="#334155" text-anchor="start">(/audit)</text>
<text x="846" y="438" font-size="13.5" font-weight="600" fill="#1d4ed8" text-anchor="start">group commit: hasta 1 024 comandos por lote</text>
<rect x="1360" y="230" width="220" height="200" rx="12" fill="#f0fdf4" stroke="#059669" stroke-width="2" />
<text x="1374" y="256" font-size="16" font-weight="700" fill="#059669" text-anchor="start">Journal (disco)</text>
<text x="1374" y="280" font-size="14" font-weight="400" fill="#334155" text-anchor="start">append [largo|crc32c|JSON]</text>
<text x="1374" y="301" font-size="14" font-weight="400" fill="#334155" text-anchor="start">UN fsync por lote</text>
<text x="1374" y="322" font-size="14" font-weight="400" fill="#334155" text-anchor="start">recién entonces responde</text>
<text x="1374" y="343" font-size="14" font-weight="400" fill="#334155" text-anchor="start">si falla: fail-stop</text>
<text x="1374" y="364" font-size="14" font-weight="400" fill="#334155" text-anchor="start">(no confirma lo no persistido)</text>
<rect x="1360" y="462" width="220" height="62" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2" />
<ellipse cx="1384" cy="493.0" rx="11" ry="14" fill="#fff" stroke="#059669" stroke-width="2"/>
<text x="1406" y="490.0" font-size="14.5" font-weight="700" fill="#059669" text-anchor="start">Volumen persistente</text>
<text x="1406" y="509.0" font-size="12.5" font-weight="400" fill="#065f46" text-anchor="start">fuente de verdad</text>
<rect x="1360" y="570" width="220" height="120" rx="12" fill="#f0fdf4" stroke="#059669" stroke-width="2" />
<text x="1374" y="596" font-size="16" font-weight="700" fill="#059669" text-anchor="start">Proyector asíncrono</text>
<text x="1374" y="620" font-size="14" font-weight="400" fill="#334155" text-anchor="start">lee solo lo ya durable</text>
<text x="1374" y="641" font-size="14" font-weight="400" fill="#334155" text-anchor="start">reanuda por offset</text>
<rect x="1650" y="570" width="220" height="120" rx="12" fill="#f0fdf4" stroke="#059669" stroke-width="2" />
<text x="1664" y="596" font-size="16" font-weight="700" fill="#059669" text-anchor="start">PostgreSQL</text>
<text x="1664" y="620" font-size="14" font-weight="400" fill="#334155" text-anchor="start">historial y trazabilidad</text>
<text x="1664" y="641" font-size="14" font-weight="400" fill="#334155" text-anchor="start">(órdenes, trades, mayor)</text>
<rect x="830" y="520" width="270" height="120" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="2" />
<text x="844" y="546" font-size="16" font-weight="700" fill="#0f172a" text-anchor="start">Snapshots</text>
<text x="844" y="570" font-size="14" font-weight="400" fill="#334155" text-anchor="start">cada 1 M de registros</text>
<text x="844" y="591" font-size="14" font-weight="400" fill="#334155" text-anchor="start">aceleran el arranque</text>
<text x="844" y="612" font-size="14" font-weight="400" fill="#334155" text-anchor="start">pausan al escritor ≈ 1-2 s</text>
<rect x="320" y="520" width="270" height="120" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="2" />
<text x="334" y="546" font-size="16" font-weight="700" fill="#d97706" text-anchor="start">Administración :9102</text>
<text x="334" y="570" font-size="14" font-weight="400" fill="#334155" text-anchor="start">/metrics → Prometheus</text>
<text x="334" y="591" font-size="14" font-weight="400" fill="#334155" text-anchor="start">pprof · /healthz · /readyz</text>
<path d="M 260,320 L 320,320" fill="none" stroke="#2563eb" stroke-width="2.6" marker-end="url(#a-2563eb)"/>
<circle cx="290" cy="296" r="14" fill="#2563eb"/>
<text x="290" y="301" font-size="15" font-weight="800" fill="#fff" text-anchor="middle">1</text>
<path d="M 550,335 L 600,335" fill="none" stroke="#2563eb" stroke-width="2.6" marker-end="url(#a-2563eb)"/>
<circle cx="575" cy="311" r="14" fill="#2563eb"/>
<text x="575" y="316" font-size="15" font-weight="800" fill="#fff" text-anchor="middle">2</text>
<path d="M 770,335 L 830,335" fill="none" stroke="#2563eb" stroke-width="2.6" marker-end="url(#a-2563eb)"/>
<circle cx="800" cy="311" r="14" fill="#2563eb"/>
<text x="800" y="316" font-size="15" font-weight="800" fill="#fff" text-anchor="middle">3</text>
<path d="M 1300,335 L 1360,335" fill="none" stroke="#059669" stroke-width="2.6" marker-end="url(#a-059669)"/>
<circle cx="1330" cy="311" r="14" fill="#2563eb"/>
<text x="1330" y="316" font-size="15" font-weight="800" fill="#fff" text-anchor="middle">4</text>
<path d="M 320,395 L 260,395" fill="none" stroke="#2563eb" stroke-width="2.6" marker-end="url(#a-2563eb)"/>
<rect x="268" y="367" width="39.0" height="24" rx="6" fill="#ffffff" stroke="none" stroke-width="1.5" opacity="0.92"/>
<text x="277" y="384" font-size="13" font-weight="600" fill="#2563eb" text-anchor="start">201</text>
<circle cx="290" cy="421" r="14" fill="#2563eb"/>
<text x="290" y="426" font-size="15" font-weight="800" fill="#fff" text-anchor="middle">5</text>
<path d="M 1470,430 L 1470,462" fill="none" stroke="#059669" stroke-width="2.6" marker-end="url(#a-059669)"/>
<path d="M 1470,524 L 1470,570" fill="none" stroke="#059669" stroke-width="2.6" marker-end="url(#a-059669)"/>
<rect x="1476" y="535" width="39.0" height="24" rx="6" fill="#ffffff" stroke="none" stroke-width="1.5" opacity="0.92"/>
<text x="1485" y="552" font-size="13" font-weight="600" fill="#059669" text-anchor="start">lee</text>
<path d="M 1580,630 L 1650,630" fill="none" stroke="#059669" stroke-width="2.6" marker-end="url(#a-059669)"/>
<circle cx="1615" cy="606" r="14" fill="#2563eb"/>
<text x="1615" y="611" font-size="15" font-weight="800" fill="#fff" text-anchor="middle">6</text>
<path d="M 960,470 L 960,520" fill="none" stroke="#64748b" stroke-width="2.6" stroke-dasharray="7 5" marker-end="url(#a-64748b)"/>
<path d="M 590 580 L 320 580" stroke="none"/>
<text x="312" y="722" font-size="13.5" font-weight="500" fill="#334155" text-anchor="start">Arranque: snapshot (si sirve) + cola del journal; cada trade reproducido se verifica contra el registrado. El journal manda: el snapshot es solo una optimización.</text>
<text x="312" y="744" font-size="13.5" font-weight="600" fill="#334155" text-anchor="start">① entra · ② se valida y se encola · ③ se ordena y empareja · ④ se persiste (UN fsync) · ⑤ recién entonces se responde · ⑥ el historial se pone al día sin bloquear al escritor.</text>
</svg>