global:
  scrape_interval: 5s        # alto a propósito para la demo; en producción 15-30 s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: orderbook
    static_configs:
      - targets: ["orderbook:9102"]   # puerto de administración (no es el de la API pública)
