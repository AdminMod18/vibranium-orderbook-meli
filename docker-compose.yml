# Levantar todo:  docker compose up --build
# Si algún puerto del host está ocupado: copie .env.example a .env y cambie el número (ver docs/EJECUTAR_LOCAL.md)
# API en http://localhost:8080   ·   Postgres en localhost:5432 (usuario/clave: postgres/orderbook)
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: orderbook
      POSTGRES_DB: orderbook
    # Solo accesible desde ESTA máquina (127.0.0.1): usa la clave por defecto de la demo. Cambie el número en .env si el puerto está ocupado.
    ports: ["127.0.0.1:${POSTGRES_PORT:-5432}:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d orderbook"]
      interval: 3s
      timeout: 3s
      retries: 20

  orderbook:
    build: .
    ports:
      - "${API_PORT:-8080}:8080"             # la API queda abierta a la red para que los evaluadores puedan llamarla (sin autenticación: MVP)
      - "127.0.0.1:${METRICS_PORT:-9102}:9102"   # métricas/pprof: solo accesibles desde esta máquina
    environment:
      DATABASE_URL: postgres://postgres:orderbook@postgres:5432/orderbook
      QUEUE_SIZE: "10000"      # ≈ ritmo × plazo de la request (2 s)
      ADMIN_PORT: "9102"      # /metrics y pprof (puerto aparte de la API)
      LOG_LEVEL: info         # debug = una línea por request
    volumes: ["journal:/data"]   # el journal DEBE vivir en un volumen: es la fuente de verdad
    # El servidor arranca y opera aunque Postgres no esté listo (el historial se pone al día solo),
    # por eso no se exige service_healthy: es una decisión de diseño, no un descuido.
    depends_on: [postgres]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 2s
      retries: 10
    restart: unless-stopped
    stop_grace_period: 30s       # deja tiempo al apagado ordenado (vaciar cola y cerrar journal)

  # Generador de carga (no arranca con `up`). Uso:
  #   docker compose run --rm loadgen -rate 5000 -duration 30s
  loadgen:
    build: .
    entrypoint: ["/loadgen"]
    command: ["-rate", "3000", "-duration", "30s"]
    environment:
      LOADGEN_URL: http://orderbook:8080
    profiles: ["load"]
    depends_on: [orderbook]

  prometheus:
    image: prom/prometheus:v2.55.1
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=2d"]
    volumes: ["./ops/prometheus:/etc/prometheus:ro"]
    ports: ["127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"]
    depends_on: [orderbook]

  grafana:
    image: grafana/grafana:11.3.1
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin                 # demo local: usuario admin / clave admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"                 # lectura sin login para la demo
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/orderbook.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["127.0.0.1:${GRAFANA_PORT:-3000}:3000"]   # usuario admin / clave admin: solo para demo local
    depends_on: [prometheus]

volumes:
  pgdata:
  journal:
